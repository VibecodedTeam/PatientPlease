<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  a { color: #531516; text-decoration: none; }
  a:hover { color: #73201f; }
  @keyframes pp-ekg { to { stroke-dashoffset: 0; } }
  @keyframes pp-ring { 0% { transform: scale(1); opacity: .5; } 70% { transform: scale(1.35); opacity: 0; } 100% { opacity: 0; } }
  @keyframes pp-blip { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
</style>
</helmet>
<div ref="{{ root }}" style="position:relative; width:100%; height:100vh; min-height:600px; overflow:hidden; background:#193447; color:#A89E96; font-family:'Bricolage Grotesque',system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center;">

  <!-- backdrop layers -->
  <div style="position:absolute; inset:0; background-image:radial-gradient(circle at 50% 30%, rgba(168,158,150,.16), rgba(168,158,150,0) 55%); pointer-events:none;"></div>
  <div style="position:absolute; inset:0; opacity:.7; pointer-events:none; background-image:url('data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2244%22 height=%2244%22 viewBox=%220 0 44 44%22><g fill=%22none%22 stroke=%22%23A89E96%22 stroke-opacity=%220.08%22 stroke-width=%222%22 stroke-linecap=%22round%22><path d=%22M22 15v14M15 22h14%22/></g></svg>');"></div>

  <!-- animated EKG line behind title -->
  <svg ref="{{ ekg }}" viewBox="0 0 1200 200" preserveAspectRatio="none" style="position:absolute; top:38%; left:0; width:100%; height:26vh; opacity:.3; pointer-events:none;">
    <polyline points="0,100 340,100 370,100 392,42 420,158 450,70 476,100 560,100 590,100 612,42 640,158 670,70 696,100 1200,100"
      fill="none" stroke="#A89E96" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      stroke-dasharray="2400" stroke-dashoffset="2400" style="animation:pp-ekg 4s linear infinite;"></polyline>
  </svg>

  <!-- clipboard chip -->
  <div style="position:relative; z-index:2; display:flex; align-items:center; gap:9px; font-family:'DM Mono',monospace; font-size:14px; letter-spacing:.22em; text-transform:uppercase; color:#A89E96; margin-bottom:26px;">
    <span ref="{{ dot }}" style="width:8px; height:8px; border-radius:50%; background:#531516; box-shadow:0 0 0 4px rgba(83,21,22,.28); animation:pp-blip 1.4s ease-in-out infinite;"></span>
    Now Admitting
  </div>

  <!-- title -->
  <h1 style="position:relative; z-index:2; margin:0; text-align:center; font-weight:800; line-height:.82; letter-spacing:-.03em; font-size:clamp(62px, 15vw, 210px); text-wrap:balance; color:#CFC7C0;">
    Patient<br>Please
  </h1>

  <!-- play button -->
  <div style="position:relative; z-index:2; margin-top:clamp(44px,7vh,80px); display:flex;">
    <span ref="{{ ring }}" style="position:absolute; inset:0; border-radius:999px; background:#531516; z-index:0; animation:pp-ring 2.2s ease-out infinite;"></span>
    <button ref="{{ btn }}" onClick="{{ onPlay }}"
      style="position:relative; z-index:1; display:inline-flex; align-items:center; gap:18px; border:none; cursor:pointer; padding:24px 56px 24px 48px; border-radius:999px; background:#531516; color:#F2ECE7; font-family:'Bricolage Grotesque',sans-serif; font-weight:800; font-size:clamp(26px,4vw,44px); letter-spacing:.02em; box-shadow:0 12px 0 #340d0e, 0 24px 34px rgba(0,0,0,.4); transition:transform .12s ease, box-shadow .12s ease;"
      style-hover="transform:translateY(-3px); box-shadow:0 15px 0 #340d0e, 0 30px 40px rgba(0,0,0,.45);"
      style-active="transform:translateY(9px); box-shadow:0 3px 0 #340d0e, 0 8px 16px rgba(0,0,0,.4);">
      <span style="display:inline-flex; align-items:center; justify-content:center; width:1.35em; height:1.35em; border-radius:50%; background:rgba(255,255,255,.15);">
        <svg width="0.62em" height="0.62em" viewBox="0 0 24 24" fill="#F2ECE7" style="margin-left:.12em;"><path d="M5 3.5v17a1 1 0 0 0 1.53.85l13.2-8.5a1 1 0 0 0 0-1.7L6.53 2.65A1 1 0 0 0 5 3.5Z"/></svg>
      </span>
      {{ label }}
    </button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{
  &quot;$preview&quot;: { &quot;width&quot;: &quot;100%&quot;, &quot;height&quot;: &quot;100%&quot; },
  &quot;label&quot;: { &quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;PLAY&quot;, &quot;tsType&quot;: &quot;string&quot; },
  &quot;accent&quot;: { &quot;editor&quot;: &quot;color&quot;, &quot;default&quot;: &quot;#531516&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;#531516&quot;, &quot;#073B33&quot;, &quot;#384254&quot;, &quot;#A89E96&quot;] },
  &quot;background&quot;: { &quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;slate&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;options&quot;: [&quot;slate&quot;, &quot;ink&quot;, &quot;forest&quot;] }
}">
class Component extends DCLogic {
  renderVals() {
    const themes = {
      slate:  { bg: '#193447', ink: '#A89E96', title: '#CFC7C0' },
      ink:    { bg: '#212129', ink: '#A89E96', title: '#CFC7C0' },
      forest: { bg: '#073B33', ink: '#A89E96', title: '#D6CFC8' },
    };
    this._theme = themes[this.props.background] || themes.slate;
    this._accent = this.props.accent || '#531516';
    return {
      root: this._root || (this._root = React.createRef()),
      btn: this._btn || (this._btn = React.createRef()),
      ring: this._ring || (this._ring = React.createRef()),
      dot: this._dot || (this._dot = React.createRef()),
      ekg: this._ekg || (this._ekg = React.createRef()),
      label: this.props.label || 'PLAY',
      onPlay: () => {
        const b = this._btn && this._btn.current;
        if (!b) return;
        b.animate(
          [{ transform: 'translateY(9px)' }, { transform: 'translateY(0)' }],
          { duration: 260, easing: 'cubic-bezier(.34,1.56,.64,1)' }
        );
      },
    };
  }
  componentDidMount() { this._apply(); }
  componentDidUpdate() { this._apply(); }
  _shade(hex, f) {
    const n = parseInt(hex.slice(1), 16);
    let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    r = Math.round(r * f); g = Math.round(g * f); b = Math.round(b * f);
    return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, v)).toString(16).padStart(2, '0')).join('');
  }
  _apply() {
    const t = this._theme, a = this._accent, dark = this._shade(a, 0.6);
    const root = this._root && this._root.current;
    if (root) {
      root.style.background = t.bg;
      root.style.color = t.ink;
      const h1 = root.querySelector('h1');
      if (h1) h1.style.color = t.title;
    }
    [this._btn, this._ring, this._dot].forEach(r => {
      if (r && r.current) r.current.style.background = a;
    });
    if (this._btn && this._btn.current) {
      this._btn.current.style.boxShadow =
        '0 12px 0 ' + dark + ', 0 24px 34px rgba(0,0,0,.4)';
    }
  }
}
</script>
</body>
</html>

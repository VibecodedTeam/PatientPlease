services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: patientplease
      POSTGRES_PASSWORD: patientplease
      POSTGRES_DB: patientplease
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U patientplease']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://patientplease:patientplease@postgres:5432/patientplease
      PORT: 4000
    ports:
      - '4000:4000'

  # frontend:
  #   build:
  #     context: src/frontend
  #     dockerfile: Dockerfile
  #   add once src/frontend/Dockerfile exists

volumes:
  postgres-data:
